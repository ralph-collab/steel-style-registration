<!DOCTYPE html>
<html>
<head>
  <title>Steel & Style Voting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #0b1a2b;
      color: white;
      margin: 0;
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #status {
      margin-bottom: 15px;
      font-size: 16px;
    }

    #searchBox {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #35506d;
      background: #142c47;
      color: white;
      box-sizing: border-box;
    }

    #searchBox::placeholder {
      color: #b7c7d9;
    }

    .card {
      background: #142c47;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
    }

    .card:hover {
      background: #1d3e63;
    }

    .selected {
      border: 2px solid gold;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background: gold;
      color: black;
      border: none;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.95;
    }

    .hidden {
      display: none;
    }

    .empty-message {
      background: #142c47;
      padding: 15px;
      border-radius: 8px;
      color: #b7c7d9;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Vote - Best of Show</h1>

    <div id="status">Loading...</div>

    <input 
      type="text" 
      id="searchBox" 
      placeholder="Search by name, make, model, or year..." 
    >

    <div id="vehicles"></div>

    <button id="submitBtn" class="hidden">Submit Vote</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxmiWtDh7aiStYDBqHuHI5zW3COr4tSlTR7mOF2r33IAf8RJID5NaHzhkvPJopbqehlXw/exec";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("t");

    let selectedVehicle = null;
    let allVehicles = [];

    async function validateTicket() {
      const res = await fetch(`${API_URL}?action=validate&token=${encodeURIComponent(token)}`);
      const data = await res.json();

      if (!data.success) {
        document.getElementById("status").innerText = "Invalid or used ticket.";
        document.getElementById("searchBox").classList.add("hidden");
        return false;
      }

      return true;
    }

    function renderVehicles() {
      const container = document.getElementById("vehicles");
      const search = document.getElementById("searchBox").value.toLowerCase().trim();

      container.innerHTML = "";

      const filteredVehicles = allVehicles.filter(v =>
        v.display.toLowerCase().includes(search)
      );

      if (filteredVehicles.length === 0) {
        container.innerHTML = `<div class="empty-message">No vehicles matched your search.</div>`;
        return;
      }

      filteredVehicles.forEach(v => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerText = v.display;

        if (selectedVehicle === v.vehicleId) {
          div.classList.add("selected");
        }

        div.onclick = () => {
          document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
          div.classList.add("selected");
          selectedVehicle = v.vehicleId;
          document.getElementById("submitBtn").classList.remove("hidden");
        };

        container.appendChild(div);
      });
    }

    async function loadVehicles() {
      const res = await fetch(`${API_URL}?action=vehicles`);
      const data = await res.json();

      allVehicles = data.vehicles || [];
      renderVehicles();
    }

    async function submitVote() {
      if (!selectedVehicle) return;

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "vote",
            token: token,
            vehicleId: selectedVehicle,
            category: "Best of Show",
            source: "web"
          })
        });

        const data = await res.json();

        if (data.success) {
          document.body.innerHTML = `
            <div style="max-width: 900px; margin: 40px auto; text-align: center; color: white; font-family: Arial, sans-serif;">
              <h1>✅ Vote Submitted</h1>
              <p>Thank you for voting.</p>
            </div>
          `;
        } else {
          document.body.innerHTML = `
            <div style="max-width: 900px; margin: 40px auto; text-align: center; color: white; font-family: Arial, sans-serif;">
              <h1>❌ Error submitting vote</h1>
              <p>Please try again or see event staff.</p>
            </div>
          `;
        }
      } catch (error) {
        document.body.innerHTML = `
          <div style="max-width: 900px; margin: 40px auto; text-align: center; color: white; font-family: Arial, sans-serif;">
            <h1>❌ Error submitting vote</h1>
            <p>Please try again or see event staff.</p>
          </div>
        `;
      }
    }

    async function init() {
      if (!token) {
        document.getElementById("status").innerText = "Missing ticket.";
        document.getElementById("searchBox").classList.add("hidden");
        return;
      }

      const valid = await validateTicket();
      if (!valid) return;

      document.getElementById("status").innerText = "";
      await loadVehicles();
    }

    document.getElementById("submitBtn").onclick = submitVote;
    document.getElementById("searchBox").addEventListener("input", renderVehicles);

    init();
  </script>
</body>
</html>
